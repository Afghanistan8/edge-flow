<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Edge-Flow">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7cf1c8" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#7cf1c8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7cf1c8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7d7d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff7d7d" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none"
        stroke="#1f2836" stroke-width="8"/>

  <!-- GMT+1 boundary: the vertical edge the whole product hangs on -->
  <rect x="246" y="96" width="6" height="320" rx="3" fill="#7cf1c8" opacity="0.28"/>

  <!-- edge ticks along the boundary -->
  <g fill="#7cf1c8" opacity="0.55">
    <rect x="232" y="128" width="34" height="5" rx="2.5"/>
    <rect x="232" y="376" width="34" height="5" rx="2.5"/>
  </g>

  <!-- flow line resolving UP across the boundary -->
  <path d="M76 322 L146 322 L186 268 L226 288 L249 256 L296 198 L346 214 L436 158"
        fill="none" stroke="url(#flow)" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the rejected branch: the DOWN path not taken -->
  <path d="M249 256 L296 316 L346 300 L436 356"
        fill="none" stroke="url(#down)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="4 26" opacity="0.8"/>

  <!-- decision node on the boundary -->
  <circle cx="249" cy="256" r="30" fill="#080b11"/>
  <circle cx="249" cy="256" r="21" fill="none" stroke="#7cf1c8" stroke-width="9"/>

  <!-- settled terminal -->
  <circle cx="436" cy="158" r="17" fill="#7cf1c8"/>
</svg>
